<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tic-Tac-Toe | 2-Player or vs Computer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a2639, #0d1b2a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Roboto, sans-serif;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 28px 24px 36px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            max-width: 550px;
            transition: all 0.2s;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #f0f9ff, #b9e0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .mode-bar {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 15px 0 20px;
        }

        .mode-btn {
            background: #1e2a3e;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #cbd5e6;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .mode-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 5px 12px rgba(59,130,246,0.4);
        }

        .mode-btn:hover:not(.active) {
            background: #2d3a50;
            color: #eef4ff;
        }

        .status-area {
            background: #0f172acc;
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #334155;
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: 0.5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 56px;
            margin-bottom: 28px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #0f172a;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Segoe UI', 'Fira Sans', monospace;
            color: #eef2ff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 0 #020617;
            border: 1px solid #334155;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .cell.X {
            color: #60a5fa;
            text-shadow: 0 0 6px #3b82f6;
        }

        .cell.O {
            color: #facc15;
            text-shadow: 0 0 6px #eab308;
        }

        .cell:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #020617;
        }

        .cell.disabled, .cell:disabled {
            cursor: default;
            transform: none;
            opacity: 0.9;
        }

        .reset-btn {
            display: block;
            width: 70%;
            margin: 0 auto;
            background: #334155;
            border: none;
            padding: 14px 0;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 6px 0 #0f172a;
        }

        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0f172a;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #7e8aa8;
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 18px 16px 28px;
            }
            .cell {
                font-size: 2.8rem;
                border-radius: 20px;
            }
            .board {
                gap: 10px;
                padding: 12px;
            }
            .status-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⭕ TIC-TAC-TOE ❌</h1>
    <div class="mode-bar">
        <button class="mode-btn active" data-mode="twoPlayer">👥 2 Players</button>
        <button class="mode-btn" data-mode="vsAI">🤖 vs Computer</button>
    </div>
    <div class="status-area">
        <div class="status-text" id="gameStatus">Player X's turn</div>
    </div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button class="reset-btn" id="resetGame">⟳ New Game</button>
    <footer>click any cell · smart AI blocks & wins</footer>
</div>

<script>
    const boardEl = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const gameStatus = document.getElementById('gameStatus');
    const resetBtn = document.getElementById('resetGame');
    const modeBtns = document.querySelectorAll('.mode-btn');

    let boardState = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let currentMode = 'twoPlayer';
    let aiTimeout = null;

    function checkWinner() {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];
        for (let pattern of winPatterns) {
            const [a,b,c] = pattern;
            if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                return boardState[a];
            }
        }
        return null;
    }

    function isDraw() {
        return boardState.every(cell => cell !== '');
    }

    function updateUI() {
        for (let i = 0; i < cells.length; i++) {
            cells[i].textContent = boardState[i];
            if (boardState[i] === 'X') {
                cells[i].classList.add('X');
                cells[i].classList.remove('O');
            } else if (boardState[i] === 'O') {
                cells[i].classList.add('O');
                cells[i].classList.remove('X');
            } else {
                cells[i].classList.remove('X', 'O');
            }
        }
    }

    function setGameOverMessage(winner) {
        if (winner === 'X') gameStatus.textContent = '🏆 Player X wins! 🎉';
        else if (winner === 'O') {
            if (currentMode === 'vsAI') gameStatus.textContent = '🤖 Computer (O) wins!';
            else gameStatus.textContent = '🏆 Player O wins! 🎉';
        } else {
            gameStatus.textContent = '🤝 It\'s a Draw!';
        }
    }

    function updateTurnMessage() {
        if (!gameActive) return;
        if (currentMode === 'vsAI' && currentPlayer === 'O') {
            gameStatus.textContent = '🤖 Computer thinking ...';
        } else {
            gameStatus.textContent = `✨ Player ${currentPlayer}'s turn ✨`;
        }
    }

    function endGame(winner) {
        gameActive = false;
        if (winner) {
            setGameOverMessage(winner);
        } else {
            gameStatus.textContent = "🤝 It's a Draw!";
        }
        if (aiTimeout) {
            clearTimeout(aiTimeout);
            aiTimeout = null;
        }
    }

    function resetGameBoard() {
        if (aiTimeout) {
            clearTimeout(aiTimeout);
            aiTimeout = null;
        }
        boardState = ['', '', '', '', '', '', '', '', ''];
        gameActive = true;
        currentPlayer = 'X';
        updateUI();
        if (currentMode === 'twoPlayer') {
            gameStatus.textContent = "Player X's turn";
        } else {
            gameStatus.textContent = "Your turn (X)";
        }
    }

    function makeMove(index, player) {
        if (!gameActive) return false;
        if (boardState[index] !== '') return false;
        if (player !== currentPlayer) return false;

        boardState[index] = player;
        updateUI();

        const winner = checkWinner();
        if (winner) {
            endGame(winner);
            return true;
        }
        if (isDraw()) {
            endGame(null);
            return true;
        }

        currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
        updateTurnMessage();
        return true;
    }

    function aiMove() {
        if (!gameActive) return;
        if (currentMode !== 'vsAI') return;
        if (currentPlayer !== 'O') return;

        if (aiTimeout) clearTimeout(aiTimeout);
        aiTimeout = setTimeout(() => {
            if (!gameActive || currentMode !== 'vsAI' || currentPlayer !== 'O') return;

            let bestMove = getBestAIMove();
            if (bestMove !== -1) {
                makeMove(bestMove, 'O');
                if (!gameActive) return;
                if (currentMode === 'vsAI' && gameActive && currentPlayer === 'X') {
                    updateTurnMessage();
                }
            }
            aiTimeout = null;
        }, 80);
    }

    function getBestAIMove() {
        let winMove = findWinningMove('O');
        if (winMove !== -1) return winMove;

        let blockMove = findWinningMove('X');
        if (blockMove !== -1) return blockMove;

        let emptyIndices = [];
        for (let i = 0; i < boardState.length; i++) {
            if (boardState[i] === '') emptyIndices.push(i);
        }
        if (emptyIndices.length === 0) return -1;
        const center = 4;
        if (boardState[center] === '') return center;
        const corners = [0,2,6,8];
        const availableCorners = corners.filter(i => boardState[i] === '');
        if (availableCorners.length) {
            const randomCorner = availableCorners[Math.floor(Math.random() * availableCorners.length)];
            return randomCorner;
        }
        const randomIndex = Math.floor(Math.random() * emptyIndices.length);
        return emptyIndices[randomIndex];
    }

    function findWinningMove(player) {
        for (let i = 0; i < boardState.length; i++) {
            if (boardState[i] === '') {
                boardState[i] = player;
                const winner = checkWinner();
                boardState[i] = '';
                if (winner === player) return i;
            }
        }
        return -1;
    }

    function handleCellClick(index) {
        if (!gameActive) return;
        if (currentMode === 'vsAI' && currentPlayer !== 'X') return;
        if (boardState[index] !== '') return;

        const moveSuccess = makeMove(index, currentPlayer);
        if (!moveSuccess) return;

        if (!gameActive) return;

        if (currentMode === 'vsAI' && gameActive && currentPlayer === 'O') {
            aiMove();
        }
    }

    function resetGame() {
        if (aiTimeout) {
            clearTimeout(aiTimeout);
            aiTimeout = null;
        }
        boardState = ['', '', '', '', '', '', '', '', ''];
        gameActive = true;
        currentPlayer = 'X';
        updateUI();
        if (currentMode === 'twoPlayer') {
            gameStatus.textContent = "Player X's turn";
        } else {
            gameStatus.textContent = "Your turn (X)";
        }
    }

    function setMode(mode) {
        if (aiTimeout) {
            clearTimeout(aiTimeout);
            aiTimeout = null;
        }
        currentMode = mode;
        resetGame();
        modeBtns.forEach(btn => {
            const btnMode = btn.getAttribute('data-mode');
            if (btnMode === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (mode === 'twoPlayer') {
            gameStatus.textContent = "Player X's turn";
        } else {
            gameStatus.textContent = "Your turn (X)";
        }
    }

    function bindEvents() {
        for (let i = 0; i < cells.length; i++) {
            cells[i].addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(cells[i].getAttribute('data-index'));
                handleCellClick(idx);
            });
        }
        resetBtn.addEventListener('click', () => {
            resetGame();
        });
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mode = btn.getAttribute('data-mode');
                if (mode === currentMode) return;
                setMode(mode);
            });
        });
    }

    function init() {
        bindEvents();
        resetGame();
    }

    init();
</script>
</body>
</html>
